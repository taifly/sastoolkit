# Builds the app for macOS, Windows and Linux when a version tag (v1.2.3) is
# pushed, and publishes the builds as a GitHub release.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.0

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION and wails.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          wails="$(jq -r .info.productVersion wails.json)"
          if [ "$tag" != "$file" ] || [ "$tag" != "$wails" ]; then
            echo "::error::tag $tag, VERSION $file, wails.json $wails must match"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            asset: sas-toolkit-macos-universal.zip
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            asset: sas-toolkit-windows-amd64.zip
          - name: Linux
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
            asset: sas-toolkit-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: |
          args=(-platform "${{ matrix.platform }}" -trimpath -clean)
          if [ -n "${{ matrix.tags }}" ]; then args+=(-tags "${{ matrix.tags }}"); fi
          wails build "${args[@]}"

      - name: Package
        run: |
          cd build/bin
          case "${{ runner.os }}" in
            macOS)   ditto -c -k --keepParent "SAS toolkit.app" "${{ matrix.asset }}" ;;
            Windows) 7z a "${{ matrix.asset }}" sas-toolkit.exe ;;
            Linux)   tar -czf "${{ matrix.asset }}" sas-toolkit ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/bin/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md." > notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          # A tag that was moved to a newer commit replaces the release's builds.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "SAS toolkit $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
